<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Fetcher</title>
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple spinning loader */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            position: relative;
            /* Position relative for absolute child elements */
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Elapsed time style */
        .elapsed-time {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3498db;
            font-weight: bold;
            font-size: 14px;
            /* Adjust font size as needed */
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col items-center justify-center h-screen">
    <p class="text-7xl font-bold mb-4 text-center">Image Gen</p>
    <p class="text-3xl font-bold mb-4 text-center">Generate image from text</p>
    <div class="w-full max-w-xl mx-auto pb-10">
        <div class="mb-4">
            <label for="promptText" class="block text-gray-700 text-sm font-bold mb-2">Enter Text</label>
            <input id="promptText" type="text" placeholder="Type your prompt..."
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="flex items-center justify-center">
            <button onclick="fetchImage()"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="button">
                Submit
            </button>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex justify-center mt-4 hidden">
            <div class="loader">
                <span id="elapsedTime" class="elapsed-time">0</span>
            </div>
        </div>

        <!-- Display the current (larger) image and download button -->
        <div id="currentImageContainer" class="mt-4 flex flex-col items-center">
            <!-- The current image will be placed here -->
            <a id="downloadLink" href="#" download
                class="mt-2 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded hidden">Download
                Image</a>
        </div>
    </div>

    <script>
        let timer; // Timer variable
        let elapsedSeconds = 0; // Elapsed seconds variable

        function updateElapsedTime() {
            elapsedSeconds++;
            document.getElementById('elapsedTime').textContent = elapsedSeconds; // Only show the seconds
        }

        function fetchImage() {
            const userText = document.getElementById('promptText').value;
            const formattedText = userText.toLowerCase().replace(/\s+/g, '_'); // Replace spaces with underscores and convert to lowercase
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(formattedText)}`;

            // Show the loader
            document.getElementById('loader').classList.remove('hidden');
            elapsedSeconds = 0; // Reset elapsed time
            document.getElementById('elapsedTime').textContent = '0'; // Reset display
            timer = setInterval(updateElapsedTime, 1000); // Start the timer

            fetch(url)
                .then(response => response.blob())
                .then(imageBlob => {
                    const imageUrl = URL.createObjectURL(imageBlob);

                    // Remove old image if present
                    const currentImageContainer = document.getElementById('currentImageContainer');
                    if (currentImageContainer.firstChild) {
                        currentImageContainer.removeChild(currentImageContainer.firstChild);
                    }

                    // Create a new image element for the current image
                    const largeImageElement = document.createElement('img');
                    largeImageElement.src = imageUrl;
                    largeImageElement.alt = userText;
                    largeImageElement.classList.add('rounded', 'shadow-lg', 'h-64', 'w-auto'); // Current image, larger size

                    // Display the new image
                    currentImageContainer.prepend(largeImageElement);

                    // Show the download button and set its link
                    const downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = imageUrl;
                    downloadLink.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error fetching the image:', error);
                })
                .finally(() => {
                    // Hide the loader after fetching
                    clearInterval(timer); // Stop the timer
                    document.getElementById('loader').classList.add('hidden');
                });
        }
    </script>
</body>

</html>
